# 本地零依赖运行配置（H2 内存库 + 关闭 Nacos）：
#   java -jar duoduo-user.jar --spring.profiles.active=local
# 目的：在没装 MySQL / 没起 Nacos 的机器上也能真实验证用户域链路。
# 表结构与生产 MySQL 完全一致（同一份 schema.sql），切生产只改 profile。
spring:
  datasource:
    url: jdbc:h2:mem:duoduo_user;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    nacos:
      discovery:
        enabled: false

logging:
  level:
    com.duoduo: DEBUG
