server:
  # 注意：不要用 USER_PORT 这类通用名，宿主/CI 环境可能已占用该变量名而静默改写端口
  port: ${DUODUO_USER_PORT:8081}
  shutdown: graceful
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 1000
    max-connections: 10000

spring:
  application:
    name: duoduo-user
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # 生产：MySQL + 主从 + 连接池（HikariCP 为 Spring Boot 默认）
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/duoduo_user?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:duoduo}
    password: ${DB_PASSWORD:duoduo}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 20
      maximum-pool-size: 100
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: duoduo-user-pool
  # 表结构由 Flyway/Liquibase 或运维 DDL 管理，应用启动不自动建表
  sql:
    init:
      mode: never

  # E17 · 权限版本的感知副本（本服务写，网关读）。
  # 连不上不影响启动与登录：PermVersionPublisher 全程 try/catch 并带 60 秒冷却，
  # 写失败时角色变更会退化为「吊销刷新令牌」这条老路（详见该类注释）。
  # 超时必须给短，否则"Redis 挂了"会变成"登录变慢"。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: input
      logic-delete-field: null

duoduo:
  security:
    jwt-secret: ${DUODUO_JWT_SECRET:duoduo-local-dev-secret-please-change-in-production-32b}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  id:
    datacenter-id: ${ID_DATACENTER:1}
    worker-id: ${ID_WORKER:1}
  geo:
    # A1 · 逆地理编码代理用的高德「Web 服务」Key。
    #   ★ 必须是「Web 服务」类型，不是 JS API Key（两者用途不同，混用会 401）。
    #   留空时 /api/geo/regeo 返回 configured=false，前端降级为手选，不报错。
    amap-key: ${AMAP_WEB_KEY:}
    # Web 端 JS API（地图选点组件用）：与上面的「Web 服务」Key 不是同一把。
    # 这两个值按高德 JSAPI 2.0 的机制**必须下发到浏览器**，因此：
    #   · 不进代码、不进 Git（只在本机 .env）；
    #   · 由 /api/geo/jsapi-config 在登录态下下发，而不是打进前端 bundle。
    js-key: ${AMAP_JS_KEY:}
    js-security-code: ${AMAP_JS_SECURITY_CODE:}
  internal:
    # 服务间调用共享密钥。用户域的内部接口只有「批量取昵称/头像」这类只读能力，
    # 但仍然必须凭据保护：昵称头像同样是用户数据，不能因为「不敏感」就裸奔。
    token: ${INTERNAL_TOKEN:duoduo-local-dev-internal-token}
    # 服务间调用凭据（第五十八轮 P0-3）：签名有效期（秒）与「每个调用方一把显式密钥」。
    # 两者都可不配：默认 300 秒，且密钥按调用方身份从根密钥派生（见 InternalCallAuth）。
    signature-skew-seconds: ${INTERNAL_SKEW_SECONDS:300}
    caller-secrets: ${INTERNAL_CALLER_SECRETS:}
  user:
    # 新用户初始信用分（A4）= 履约域信用分模型的基础分。
    # 两处各自持有这个常量（无共享模块），一致性由 credit-smoke 守住：
    # 「新注册用户库内分数 == 信用分接口给出的基础分」。
    # 改这里必须同步改履约域的 duoduo.credit.base，否则新用户会立刻出现分数分裂。
    credit-default: ${USER_CREDIT_DEFAULT:60}
  materials:
    # E12 · 入驻资质材料的本地落盘目录（仅在 storage.type=local 时使用）。
    # 容器里通过独立卷挂载持久化，见 docker-compose.yml。★ 该卷不挂任何公开 nginx 路径。
    dir: ${MATERIALS_DIR:/data/merchant-materials}
  storage:
    # S9 · 存储介质。local（默认，本地盘）| cos（腾讯云对象存储）。
    # ★ 默认必须是 local：新存储层一旦有问题，改回这一行重启即可回退。
    # ★ 本服务的资质材料必须走**私有桶**（bucket-private），绝不允许改指向公开桶 ——
    #   营业执照 + 法人身份证 + 银行账户一旦变成匿名可读的对象，就是一次数据事故。
    type: ${STORAGE_TYPE:local}
    cos:
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      region: ${COS_REGION:}
      # 公开桶由履约域使用；本服务不写它，配置项同样保持齐全。
      bucket-public: ${COS_BUCKET_PUBLIC:}
      # ★ 私有桶：入驻资质材料
      bucket-private: ${COS_BUCKET_PRIVATE:}
  wechat:
    # A13 · 小程序登录凭据。appid/secret 从微信公众平台获取，只经环境变量注入，
    # 绝不写入代码库；两者缺一时微信登录返回 503 DEGRADED（如实降级）。
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
    # mock 通道（mock:<openid> 形式的 code 直接换 openid，不调微信服务器）：
    # 仅限本地 / CI 冒烟使用。注意 A5 环境变量命名纪律：走 DUODUO_ 前缀，
    # 避免宿主通用名静默覆盖。生产必须为 false。
    mock-enabled: ${DUODUO_WECHAT_MOCK_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.duoduo: INFO
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"duoduo-user","requestId":"%X{requestId}","logger":"%c{1}","msg":"%replace(%m){''"'',''\\"''}","thread":"%t"}%n'

# ── OpenAPI 契约（A6）────────────────────────────────────────────
# 随 duoduo-common-web 的 knife4j starter 自动装配，导出 /v3/api-docs 供契约比对与前端联调。
# 安全边界：网关路由是显式前缀白名单，/v3/api-docs 与 /doc.html 不会被路由到公网入口；
# 服务直连端口（8081~8085）仅本机/内网可达。生产若要彻底关闭，把 enabled 置 false 即可。
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false
knife4j:
  enable: true
  setting:
    language: zh_cn
