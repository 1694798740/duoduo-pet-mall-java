server:
  # 不要用 AI_PORT 这类通用名，宿主/CI 环境可能已占用该变量名而静默改写端口
  port: ${DUODUO_AI_PORT:8086}
  shutdown: graceful
  tomcat:
    threads:
      max: 100
      min-spare: 20

spring:
  application:
    name: duoduo-ai
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/duoduo_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:duoduo}
    password: ${DB_PASSWORD:duoduo}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 20
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  elasticsearch:
    uris: ${DUODUO_ES_URL:http://127.0.0.1:9200}
    connection-timeout: 500ms
    socket-timeout: 3s
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input

duoduo:
  ai:
    # DashScope（阿里云百炼）OpenAI 兼容模式。**Key 只走环境变量**，与微信 secret 同纪律。
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DUODUO_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    # 2026-10-29：支持逗号分隔的优先级列表，主对话与流式回复都会按顺序回退
    model: ${DUODUO_AI_MODEL:qwen-plus}
    # 2026-10-28 重构：彻底移除 mock 模式。未配置 Key 时如实返回 DEGRADED。
    # LLM 调用超时（秒）：工具决策链路允许更长，首字由 SSE 流式保证
    timeout-seconds: ${DUODUO_AI_TIMEOUT_SECONDS:60}
    stream-timeout-seconds: ${DUODUO_AI_STREAM_TIMEOUT_SECONDS:120}
    embedding-model: ${DUODUO_AI_EMBEDDING_MODEL:text-embedding-v3}
    rerank-model: ${DUODUO_AI_RERANK_MODEL:gte-rerank-v2}
    # RAG 检索开关：ES 不可用时自动降级到商品域结构化搜索
    rag-enabled: ${DUODUO_AI_RAG_ENABLED:true}
    # 每 IP 每分钟对话次数：保护 LLM 配额的第一道闸。超限 429 RATE_LIMITED。
    # 限流键**不是**客户端可伪造的请求头（第五十七轮加固，见 AiController.clientKey）。
    rate-limit-per-minute: ${DUODUO_AI_RATE_LIMIT:20}
    # 全站每分钟总配额：单键限流防不住「换 IP 分布式刷」，总配额保证
    # 「无论怎么绕，每分钟的调用总数有上界」。两道闸都需要，缺一不可。
    global-rate-limit-per-minute: ${DUODUO_AI_GLOBAL_RATE_LIMIT:300}
    # 商品召回（跨域内部调用）的超时：与 LLM 的 15s **刻意分开**。
    # 召回是库内查询，正常百毫秒级；给 1.5s 已经很宽松。分开的意义在于
    # 商品域变慢时 AI 能快速降级并指出「商品信息取不到」，而不是被拖到线程池耗尽、
    # 表现成「AI 全挂了」——故障归因清楚的代价只是多两个数字。
    recall:
      connect-timeout-ms: ${DUODUO_AI_RECALL_CONNECT_TIMEOUT_MS:300}
      read-timeout-ms: ${DUODUO_AI_RECALL_READ_TIMEOUT_MS:1500}
  internal:
    # 调商品域内部候选接口用的共享密钥（与其它服务同一个环境变量）
    token: ${INTERNAL_TOKEN:duoduo-local-dev-internal-token}
    # 服务间调用凭据（第五十八轮 P0-3）：签名有效期（秒）与「每个调用方一把显式密钥」。
    # 两者都可不配：默认 300 秒，且密钥按调用方身份从根密钥派生（见 InternalCallAuth）。
    signature-skew-seconds: ${INTERNAL_SKEW_SECONDS:300}
    caller-secrets: ${INTERNAL_CALLER_SECRETS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.duoduo: INFO
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"duoduo-ai","requestId":"%X{requestId}","logger":"%c{1}","msg":"%replace(%m){''"'',''\\"''}","thread":"%t"}%n'

# ── OpenAPI 契约（A6 同款）────────────────────────────────────
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false
knife4j:
  enable: true
  setting:
    language: zh_cn
