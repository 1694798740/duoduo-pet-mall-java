# RocketMQ Broker 配置（A11 · 开发/演示口径）
#
# brokerIP1 必须写 compose 服务名 rocketmq-broker：
#   broker 会把这个地址注册进 NameServer，客户端（trade 容器）按它回连 ——
#   写宿主 IP 或 127.0.0.1，容器网络内都不可达（T-63 候选：broker 注册地址错 =
#   「生产者发送超时 / 消费者收不到消息」，与 MQ 挂了是两种不同的故障）。
brokerClusterName=DuoduoCluster
brokerName=broker-a
brokerId=0
brokerIP1=rocketmq-broker
listenPort=10911

# 开发/演示：topic 与消费组自动创建，省去运维脚本；生产必须改 false 并走审批建 topic
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

# 异步刷盘：性能优先，宕机丢最后几毫秒的数据可接受（下单任务可重放）
flushDiskType=ASYNC_FLUSH
deleteWhen=04
fileReservedTime=48
