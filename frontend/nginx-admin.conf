# 平台管理后台站点配置（T-ARCH 第一步：独立端口 + 独立主机名 + 独立登录）
#
# 与商城站点（nginx.conf）的差别只有三点，其余（/api 反代、上传体积、静态缓存）保持一致：
#   ① 根路径直接跳管理后台入口，商城首页在**这个站点上不存在**；
#   ② SPA 兜底指向 admin.html（而不是商城的 index.html）——
#      这样在后台站点上敲任何路径都不会"掉进商城"；
#   ③ 独立主机名（admin.localhost）带来**独立的 Cookie**：
#      Cookie 不带 Domain 属性、是主机级作用域，**端口不参与**——
#      所以"同一台机器不同端口"仍会共享登录态，必须靠**不同主机名**隔离。

server {
    listen 80;
    server_name admin.localhost localhost;

    root /usr/share/nginx/html;
    index admin.html;

    # 512m：视频改为端侧压缩后不限制大小（时长 ≤60s 由端侧把关），
    # 服务端不再按 MB 拒绝；nginx 仍需要一个上限防止单请求打满，取 512m。
    client_max_body_size 512m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # 根路径与 /admin 一律收敛到管理后台入口（避免误落商城首页）
    location = / {
        return 302 $scheme://$http_host/admin.html;
    }
    location = /console {
        return 302 $scheme://$http_host/admin.html;
    }

    # 同源反代：与商城同一套（Host 必须用 $http_host，见 docs/agent/08 的 T-66）
    # 站内相对路径的图片（上传接口在拿不到代理头时返回 /uploads/<uuid>.<ext>）。
    # 与 /api 同样走网关转发到履约服务的公开读端点；不加这段，相对路径会落到
    # nginx 静态目录 → 404，表现为"刚上传成功却显示裂图"。
    location /uploads/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway duoduo-gateway-app:8080;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # E13 · 用变量 + Docker DNS 动态解析：nginx 对静态 proxy_pass 主机名只在启动时
        #   解析一次并缓存 —— 网关容器一旦重建（IP 变化），站点就会整站 502 直到重启
        #   （E13 全量回归时 14 套齐崩的根因）。resolver 指向 Docker 内嵌 DNS，10s 刷新。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway duoduo-gateway-app:8080;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        # E8 · 入口标识：本站登录的令牌 ent=admin，网关据此允许访问 /api/admin/**、禁止 /api/seller/**
        proxy_set_header X-Duoduo-Entry admin;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # 实时通道（2026-10-23）：WebSocket 必须显式设置 Upgrade/Connection，
    # 否则 nginx 按普通 HTTP 转发，握手失败（浏览器侧表现为 1006 异常关闭）。
    # proxy_read_timeout 放到 1 小时：聊天连接是长连接，默认 60s 会被 nginx 主动断开。
    location /ws/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway duoduo-gateway-app:8080;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /sandbox/ {
        # E13 · 用变量 + Docker DNS 动态解析：nginx 对静态 proxy_pass 主机名只在启动时
        #   解析一次并缓存 —— 网关容器一旦重建（IP 变化），站点就会整站 502 直到重启
        #   （E13 全量回归时 14 套齐崩的根因）。resolver 指向 Docker 内嵌 DNS，10s 刷新。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway duoduo-gateway-app:8080;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /admin.html {
        add_header Cache-Control "no-store";
    }

    # SPA 兜底 → 后台入口（本站点不提供商城页面）
    location / {
        try_files $uri $uri/ /admin.html;
    }
}
