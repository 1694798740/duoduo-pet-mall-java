# 第三方商家平台站点配置（E6：独立端口 + 独立主机名 + 独立登录）
#
# 与商城（nginx.conf）、平台后台（nginx-admin.conf）的差别只在"站点根与兜底指向哪个入口"：
#   根路径 → 商家工作台入口；SPA 兜底也指向 merchant.html（本站点**不提供**商城与后台页面）。
# 独立主机名（merchant.localhost）带来**独立的 Cookie** → 三方登录态互不共享。
server {
    listen 80;
    server_name merchant.localhost localhost;

    root /usr/share/nginx/html;
    index merchant.html;

    client_max_body_size 16m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    location = / {
        return 302 $scheme://$http_host/merchant.html;
    }
    location = /workspace {
        return 302 $scheme://$http_host/merchant.html;
    }

    location /api/ {
        proxy_pass http://duoduo-gateway-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /merchant.html {
        add_header Cache-Control "no-store";
    }

    # SPA 兜底 → 商家工作台入口
    location / {
        try_files $uri $uri/ /merchant.html;
    }
}
