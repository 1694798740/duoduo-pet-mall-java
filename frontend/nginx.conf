# 网页端容器的 nginx 站点配置（S1）
#
# 三件事，与 `vite.config.ts` 的开发代理**保持一致**（开发态与正式态的口径必须一样，
# 否则会出现"开发能用、正式版不能用"这类极难排查的问题）：
#   ① SPA 兜底：前端路由（/messages/xxx、/admin/...）刷新时不能 404；
#   ② 同源反代：/api 与 /sandbox 转给网关（浏览器始终同源 → Cookie 正常、无跨域）；
#   ③ 上传体积：与后端上限对齐（后端 max-request-size=12MB，这里留余量给 16MB）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ③ 上传体积：后端 multipart 上限是「单文件 6MB / 整请求 12MB」，
    #    这里给 16MB —— 若 nginx 卡在更小的值上，用户会在上传大图时收到 413，
    #    而后端日志里什么都看不到（因为请求根本没到后端），属于典型的"看起来后端坏了"。
    # 512m：视频改为端侧压缩后不限制大小（时长 ≤60s 由端侧把关），
    # 服务端不再按 MB 拒绝；nginx 仍需要一个上限防止单请求打满，取 512m。
    client_max_body_size 512m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # ② 同源反代：浏览器请求 /api/** 就是在请求本站，由 nginx 转给网关
    # 站内相对路径的图片（上传接口在拿不到代理头时返回 /uploads/<uuid>.<ext>）。
    # 与 /api 同样走网关转发到履约服务的公开读端点；不加这段，相对路径会落到
    # nginx 静态目录 → 404，表现为"刚上传成功却显示裂图"。
    location /uploads/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway duoduo-gateway-app:8080;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # E13 · 用变量 + Docker DNS 动态解析：nginx 对静态 proxy_pass 主机名只在启动时
        #   解析一次并缓存 —— 网关容器一旦重建（IP 变化），站点就会整站 502 直到重启
        #   （E13 全量回归时 14 套齐崩的根因）。resolver 指向 Docker 内嵌 DNS，10s 刷新。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway duoduo-gateway-app:8080;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        # E8 · 入口标识：告诉网关"这个请求来自商城站点"，登录/注册签发令牌时把它写进令牌的 ent。
        # ★ proxy_set_header 会**覆盖**客户端自带的同名头 —— 在商城站点上无法伪造入口；
        #   网关侧还会再做一次归一化（只认三个合法字面量），直连网关（小程序）不带该头 → 令牌不声明入口。
        proxy_set_header X-Duoduo-Entry mall;
        # ★ 必须用 $http_host（带端口），不能用 $host（不带端口）：
        #   浏览器发的 Origin 是 http://localhost:8088，若后端看到的 Host 是 "localhost"（无端口），
        #   网关会判定「Origin 与 Host 不同源」→ 按跨域处理 → 8088 不在白名单 → **403**。
        #   这正是 S1 首版的现象：匿名访问时 /api/auth/refresh 返回 403，而同一份代码在
        #   开发态（vite proxy 用 changeOrigin 转发成 8080）下不会出现 —— 属于"换了入口才暴露"的问题。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 刻意不设 Upgrade/Connection: upgrade —— 本应用没有 WebSocket/SSE（私信 v1 明确不做实时推送），
        # 强行设置会破坏到网关的长连接复用，属于无收益的复杂度。
    }

    # 沙箱收银台是网关侧的服务端渲染页面，二维码指向 /sandbox/pay/**
    # 实时通道（2026-10-23）：WebSocket 必须显式设置 Upgrade/Connection，
    # 否则 nginx 按普通 HTTP 转发，握手失败（浏览器侧表现为 1006 异常关闭）。
    # proxy_read_timeout 放到 1 小时：聊天连接是长连接，默认 60s 会被 nginx 主动断开。
    location /ws/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway duoduo-gateway-app:8080;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /sandbox/ {
        # E13 · 用变量 + Docker DNS 动态解析：nginx 对静态 proxy_pass 主机名只在启动时
        #   解析一次并缓存 —— 网关容器一旦重建（IP 变化），站点就会整站 502 直到重启
        #   （E13 全量回归时 14 套齐崩的根因）。resolver 指向 Docker 内嵌 DNS，10s 刷新。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway duoduo-gateway-app:8080;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        # E8 · 入口标识：与 /api/ 同一来源口径（沙箱支付页上发起的请求也属于商城站点）
        proxy_set_header X-Duoduo-Entry mall;
        # ★ 必须用 $http_host（带端口），不能用 $host（不带端口）：
        #   浏览器发的 Origin 是 http://localhost:8088，若后端看到的 Host 是 "localhost"（无端口），
        #   网关会判定「Origin 与 Host 不同源」→ 按跨域处理 → 8088 不在白名单 → **403**。
        #   这正是 S1 首版的现象：匿名访问时 /api/auth/refresh 返回 403，而同一份代码在
        #   开发态（vite proxy 用 changeOrigin 转发成 8080）下不会出现 —— 属于"换了入口才暴露"的问题。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/health {
        # E13 · 用变量 + Docker DNS 动态解析：nginx 对静态 proxy_pass 主机名只在启动时
        #   解析一次并缓存 —— 网关容器一旦重建（IP 变化），站点就会整站 502 直到重启
        #   （E13 全量回归时 14 套齐崩的根因）。resolver 指向 Docker 内嵌 DNS，10s 刷新。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway duoduo-gateway-app:8080;
        proxy_pass http://$gateway;
        # ★ 必须用 $http_host（带端口），不能用 $host（不带端口）：
        #   浏览器发的 Origin 是 http://localhost:8088，若后端看到的 Host 是 "localhost"（无端口），
        #   网关会判定「Origin 与 Host 不同源」→ 按跨域处理 → 8088 不在白名单 → **403**。
        #   这正是 S1 首版的现象：匿名访问时 /api/auth/refresh 返回 403，而同一份代码在
        #   开发态（vite proxy 用 changeOrigin 转发成 8080）下不会出现 —— 属于"换了入口才暴露"的问题。
        proxy_set_header Host $http_host;
    }

    # 【E7-2 移除】本站点曾提供后台入口短地址 /console（跳 admin.html）。
    # 后台已独立成 apps/admin、商城产物里**没有 admin.html**，这条跳转会落到 404；
    # 后台的短地址归后台站点自己：http://admin.localhost:8090/console。

    # 带哈希文件名的静态资源：可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存：否则发新版本后用户仍拿到旧入口（表现为"改了没生效"）
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ① SPA 兜底：找不到文件就交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
