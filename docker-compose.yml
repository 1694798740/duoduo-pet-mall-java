# 多多宠物商店 · 基础设施编排（本机开发首选方式）
#
# 说明：本文件提供「真微服务多进程」所需的中间件，是**开发环境的首选**运行方式。
# 备用方式（Docker 出问题且无法解决时才用）：免安装 ZIP 版 MySQL + Redis，
#   见 scripts/start-infra.ps1 / stop-infra.ps1；或轻量验证用 application-local.yml（H2 + 关闭 Nacos）。
#
# 用法：
#   mvn -gs maven/settings.xml -B -DskipTests package   # ① 先构建三个服务的 jar
#   docker compose up -d --build                        # ② 起中间件 + 业务服务
#   docker compose up -d mysql redis nacos              #    只起中间件（业务用本机进程跑）
#   docker compose logs -f duoduo-user-app              #    看某个服务日志
#   docker compose down                                 # 停（保留数据卷）；加 -v 连数据一起删
#
# 目录 role 划分：mysql / redis / nacos 是中间件（用官方镜像），
#                 duoduo-*-app 是本项目业务服务（用根目录 Dockerfile 构建）。
#
# 首次启动会自动执行 docs/sql/ 下的初始化脚本（仅数据卷为空时执行一次）：
#   00-init-databases-and-user.sql  建 duoduo_user / duoduo_product / nacos 三个库，
#                                   建应用账号 duoduo/duoduo 并授权
#   01-duoduo-user.sql              用户域建表
#   02-duoduo-product.sql           商品域建表 + 种子数据
# 生产环境请勿直接使用此文件：账号口令、资源规格、持久化与高可用策略都需要按容量重新设计。

services:
  mysql:
    image: mysql:8.0.36
    container_name: duoduo-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-duoduo_root}
      # 仅创建一个库用于通过健康检查；其余库由 00-init-databases-and-user.sql 创建
      MYSQL_DATABASE: duoduo_user
      # 应用约定「时间统一 UTC」：JDBC 连接串带 serverTimezone=UTC，免安装版 MySQL 也用 +00:00。
      # 容器必须同口径，否则 TIMESTAMP 读写会出现 8 小时偏差（影响令牌过期等时间比较逻辑）。
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      # 生产应由 DBA 按容量重新设定，这里取开发默认值
      - --max-connections=2000
      - --innodb-buffer-pool-size=1G
      - --slow-query-log=ON
      - --long-query-time=0.2
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${MYSQL_ROOT_PASSWORD:-duoduo_root}']
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: duoduo-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '2gb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: duoduo-nacos
    restart: unless-stopped
    ports:
      - '8848:8848'
      - '9848:9848'
    environment:
      MODE: standalone
      # PREFER_HOST_MODE=hostname 让控制台与客户端都用 localhost 访问，避免回显容器内 IP
      PREFER_HOST_MODE: hostname
      # 开发环境使用内嵌 Derby：省掉导入 nacos-mysql.sql 的步骤，起停更快。
      # 若要让 Nacos 也用 MySQL 持久化（更接近生产），去掉下面 Nacos 相关的注释并
      # 先把 docs/sql/nacos-mysql.sql 放进来（来自 Nacos 发行包的 conf/mysql-schema.sql）。
      # SPRING_DATASOURCE_PLATFORM: mysql
      # MYSQL_SERVICE_HOST: mysql
      # MYSQL_SERVICE_PORT: 3306
      # MYSQL_SERVICE_DB_NAME: nacos
      # MYSQL_SERVICE_USER: root
      # MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-duoduo_root}
      JVM_XMS: 512m
      JVM_XMX: 512m
    # Nacos 镜像内自带 curl（已实测 /usr/bin/curl），可以直接打到 readiness 端点。
    # 有了 healthcheck，业务服务才能用 condition: service_healthy 等待注册中心真正可用，
    # 否则服务会先起来注册失败、再靠重试。
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8848/nacos/v1/console/health/readiness']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 业务服务
  #
  # 要点：
  #   * 用**默认 profile**（不是 local）：走 Nacos 服务发现，网关用 lb:// 负载均衡，
  #     这与生产形态一致；local 档的静态 127.0.0.1 路由只在容器外跑进程时才适用。
  #   * 数据库连接靠环境变量覆盖（各模块 application.yml 已参数化 DB_URL /
  #     DB_USERNAME / DB_PASSWORD），因此容器化不需要改任何 Java 代码。
  #   * 先 mvn package 构建出 jar，compose 才会用 Dockerfile 把它拷进镜像。
  # ---------------------------------------------------------------------------
  duoduo-user-app:
    container_name: duoduo-app-user
    image: duoduo/duoduo-user:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: duoduo-user/target/duoduo-user-1.0.0.jar
        APP_PORT: '8081'
    restart: unless-stopped
    environment:
      DUODUO_USER_PORT: '8081'
      DB_URL: 'jdbc:mysql://mysql:3306/duoduo_user?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
      DB_USERNAME: duoduo
      DB_PASSWORD: duoduo
      NACOS_ENABLED: 'true'
      NACOS_ADDR: 'nacos:8848'
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      DUODUO_JWT_SECRET: ${DUODUO_JWT_SECRET:-duoduo-local-dev-secret-please-change-in-production-32b}
      # 内部接口凭据（/api/users/internal/**：批量取昵称头像，供履约域评价列表补全展示）
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-duoduo-local-dev-internal-token}
      # A13 · 微信登录：appid/secret 上线后经环境变量注入（WECHAT_APPID / WECHAT_SECRET）；
      # 本地/CI 开 mock 通道跑冒烟（生产必须去掉或置 false）。
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      DUODUO_WECHAT_MOCK_ENABLED: ${DUODUO_WECHAT_MOCK_ENABLED:-true}
    ports:
      - '8081:8081'
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  duoduo-product-app:
    container_name: duoduo-app-product
    image: duoduo/duoduo-product:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: duoduo-product/target/duoduo-product-1.0.0.jar
        APP_PORT: '8082'
    restart: unless-stopped
    environment:
      DUODUO_PRODUCT_PORT: '8082'
      DB_URL: 'jdbc:mysql://mysql:3306/duoduo_product?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
      DB_USERNAME: duoduo
      DB_PASSWORD: duoduo
      NACOS_ENABLED: 'true'
      NACOS_ADDR: 'nacos:8848'
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      # 服务间调用共享密钥：保护商品服务的库存写接口（/api/products/skus/stock/**）。
      # 生产必须由外部注入真实值（compose 里只提供开发默认值）。
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-duoduo-local-dev-internal-token}
    ports:
      - '8082:8082'
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  duoduo-trade-app:
    container_name: duoduo-app-trade
    image: duoduo/duoduo-trade:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: duoduo-trade/target/duoduo-trade-1.0.0.jar
        APP_PORT: '8083'
    restart: unless-stopped
    environment:
      DUODUO_TRADE_PORT: '8083'
      DB_URL: 'jdbc:mysql://mysql:3306/duoduo_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
      DB_USERNAME: duoduo
      DB_PASSWORD: duoduo
      NACOS_ENABLED: 'true'
      NACOS_ADDR: 'nacos:8848'
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-duoduo-local-dev-internal-token}
    ports:
      - '8083:8083'
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # 履约服务（M11/P2-1）：评价与晒单。读订单事实靠内部凭据调交易服务，故依赖 trade 健康。
  duoduo-fulfilment-app:
    container_name: duoduo-app-fulfilment
    image: duoduo/duoduo-fulfilment:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: duoduo-fulfilment/target/duoduo-fulfilment-1.0.0.jar
        APP_PORT: '8084'
    restart: unless-stopped
    environment:
      DUODUO_FULFILMENT_PORT: '8084'
      DB_URL: 'jdbc:mysql://mysql:3306/duoduo_fulfilment?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
      DB_USERNAME: duoduo
      DB_PASSWORD: duoduo
      NACOS_ENABLED: 'true'
      NACOS_ADDR: 'nacos:8848'
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-duoduo-local-dev-internal-token}
    ports:
      - '8084:8084'
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      duoduo-trade-app:
        condition: service_healthy

  # 营销服务（A5）：优惠券。被交易域单向依赖（下单锁券 / 支付核销 / 关单解锁），自己不调别人。
  duoduo-marketing-app:
    container_name: duoduo-app-marketing
    image: duoduo/duoduo-marketing:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: duoduo-marketing/target/duoduo-marketing-1.0.0.jar
        APP_PORT: '8085'
    restart: unless-stopped
    environment:
      DUODUO_MARKETING_PORT: '8085'
      DB_URL: 'jdbc:mysql://mysql:3306/duoduo_marketing?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
      DB_USERNAME: duoduo
      DB_PASSWORD: duoduo
      NACOS_ENABLED: 'true'
      NACOS_ADDR: 'nacos:8848'
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      # 服务间调用共享密钥：保护内部锁券 / 核销 / 解锁接口
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-duoduo-local-dev-internal-token}
      # 券锁定保留时长（分钟）。必须**略大于**交易域的订单超时关单时长（默认 30），
      # 否则会出现「订单还没关、券已被解锁给别人领走」。
      COUPON_LOCK_TTL_MINUTES: '35'
    ports:
      - '8085:8085'
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  duoduo-gateway-app:
    container_name: duoduo-app-gateway
    image: duoduo/duoduo-gateway:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: duoduo-gateway/target/duoduo-gateway-1.0.0.jar
        APP_PORT: '8080'
    restart: unless-stopped
    environment:
      DUODUO_GATEWAY_PORT: '8080'
      NACOS_ENABLED: 'true'
      NACOS_ADDR: 'nacos:8848'
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      DUODUO_JWT_SECRET: ${DUODUO_JWT_SECRET:-duoduo-local-dev-secret-please-change-in-production-32b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - '8080:8080'
    depends_on:
      duoduo-user-app:
        condition: service_healthy
      duoduo-product-app:
        condition: service_healthy
      duoduo-trade-app:
        condition: service_healthy
      duoduo-fulfilment-app:
        condition: service_healthy
      duoduo-marketing-app:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
