# 多多宠物商店 · 基础设施编排（本机开发首选方式）
#
# 说明：本文件提供「真微服务多进程」所需的中间件，是**开发环境的首选**运行方式。
# 备用方式（Docker 出问题且无法解决时才用）：免安装 ZIP 版 MySQL + Redis，
#   见 scripts/start-infra.ps1 / stop-infra.ps1；或轻量验证用 application-local.yml（H2 + 关闭 Nacos）。
#
# 用法：
#   mvn -gs maven/settings.xml -B -DskipTests package   # ① 先构建三个服务的 jar
#   docker compose up -d --build                        # ② 起中间件 + 业务服务
#   docker compose up -d mysql redis nacos              #    只起中间件（业务用本机进程跑）
#   docker compose logs -f duoduo-user-app              #    看某个服务日志
#   docker compose down                                 # 停（保留数据卷）；加 -v 连数据一起删
#
# 目录 role 划分：mysql / redis / nacos 是中间件（用官方镜像），
#                 duoduo-*-app 是本项目业务服务（用根目录 Dockerfile 构建）。
#
# 首次启动会自动执行 docs/sql/ 下的初始化脚本（仅数据卷为空时执行一次）：
#   00-init-databases-and-user.sql  建 duoduo_user / duoduo_product / nacos 三个库，
#                                   建应用账号 duoduo/duoduo 并授权
#   01-duoduo-user.sql              用户域建表
#   02-duoduo-product.sql           商品域建表 + 种子数据
# 生产环境请勿直接使用此文件：账号口令、资源规格、持久化与高可用策略都需要按容量重新设计。

services:
  mysql:
    image: mysql:8.0.36
    container_name: duoduo-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-duoduo_root}
      # 仅创建一个库用于通过健康检查；其余库由 00-init-databases-and-user.sql 创建
      MYSQL_DATABASE: duoduo_user
      # 应用约定「时间统一 UTC」：JDBC 连接串带 serverTimezone=UTC，免安装版 MySQL 也用 +00:00。
      # 容器必须同口径，否则 TIMESTAMP 读写会出现 8 小时偏差（影响令牌过期等时间比较逻辑）。
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      # 生产应由 DBA 按容量重新设定，这里取开发默认值
      - --max-connections=2000
      - --innodb-buffer-pool-size=1G
      - --slow-query-log=ON
      - --long-query-time=0.2
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${MYSQL_ROOT_PASSWORD:-duoduo_root}']
      # start_period：CI 冷机器首次初始化（执行 00~08 全部建库 SQL）可能远慢于本地，
      # 宽限期内健康检查失败不计入 retries —— 否则偶发「dependency failed to start」（T-45）。
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: duoduo-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '2gb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: duoduo-nacos
    restart: unless-stopped
    ports:
      - '8848:8848'
      - '9848:9848'
    environment:
      MODE: standalone
      # PREFER_HOST_MODE=hostname 让控制台与客户端都用 localhost 访问，避免回显容器内 IP
      PREFER_HOST_MODE: hostname
      # 开发环境使用内嵌 Derby：省掉导入 nacos-mysql.sql 的步骤，起停更快。
      # 若要让 Nacos 也用 MySQL 持久化（更接近生产），去掉下面 Nacos 相关的注释并
      # 先把 docs/sql/nacos-mysql.sql 放进来（来自 Nacos 发行包的 conf/mysql-schema.sql）。
      # SPRING_DATASOURCE_PLATFORM: mysql
      # MYSQL_SERVICE_HOST: mysql
      # MYSQL_SERVICE_PORT: 3306
      # MYSQL_SERVICE_DB_NAME: nacos
      # MYSQL_SERVICE_USER: root
      # MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-duoduo_root}
      JVM_XMS: 512m
      JVM_XMX: 512m
    # Nacos 镜像内自带 curl（已实测 /usr/bin/curl），可以直接打到 readiness 端点。
    # 有了 healthcheck，业务服务才能用 condition: service_healthy 等待注册中心真正可用，
    # 否则服务会先起来注册失败、再靠重试。
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8848/nacos/v1/console/health/readiness']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 业务服务
  #
  # 要点：
  #   * 用**默认 profile**（不是 local）：走 Nacos 服务发现，网关用 lb:// 负载均衡，
  #     这与生产形态一致；local 档的静态 127.0.0.1 路由只在容器外跑进程时才适用。
  #   * 数据库连接靠环境变量覆盖（各模块 application.yml 已参数化 DB_URL /
  #     DB_USERNAME / DB_PASSWORD），因此容器化不需要改任何 Java 代码。
  #   * 先 mvn package 构建出 jar，compose 才会用 Dockerfile 把它拷进镜像。
  # ---------------------------------------------------------------------------
  duoduo-user-app:
    container_name: duoduo-app-user
    image: duoduo/duoduo-user:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: duoduo-user/target/duoduo-user-1.0.0.jar
        APP_PORT: '8081'
    restart: unless-stopped
    environment:
      DUODUO_USER_PORT: '8081'
      DB_URL: 'jdbc:mysql://mysql:3306/duoduo_user?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
      DB_USERNAME: duoduo
      DB_PASSWORD: duoduo
      NACOS_ENABLED: 'true'
      NACOS_ADDR: 'nacos:8848'
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      DUODUO_JWT_SECRET: ${DUODUO_JWT_SECRET:-duoduo-local-dev-secret-please-change-in-production-32b}
      # 内部接口凭据（/api/users/internal/**：批量取昵称头像，供履约域评价列表补全展示）
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-duoduo-local-dev-internal-token}
      # A13 · 微信登录：appid/secret 上线后经环境变量注入（WECHAT_APPID / WECHAT_SECRET）；
      # 本地/CI 开 mock 通道跑冒烟（生产必须去掉或置 false）。
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      # A1 · 地址「定位回填」用的高德「Web 服务」Key（不是 JS API Key）。
      #   留空则 /api/geo/regeo 返回 configured=false，前端自动降级为手选下拉。
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      # Web 端 JS API（地图组件）：Key + 安全密钥，由 /api/geo/jsapi-config 按登录态下发
      AMAP_JS_KEY: ${AMAP_JS_KEY:-}
      AMAP_JS_SECURITY_CODE: ${AMAP_JS_SECURITY_CODE:-}
      # OPS-SWITCH 默认 true —— mock 通道仅供本地/CI；生产接真实微信必须显式置 false
      DUODUO_WECHAT_MOCK_ENABLED: ${DUODUO_WECHAT_MOCK_ENABLED:-true}
      # E17 · 权限版本的感知副本写通道（角色变更时广播给网关）
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # S9 · 存储介质：local（默认，本地盘的私有卷）| cos（腾讯云私有桶）。
      #   ★ 资质材料必须走私有桶；把 COS_BUCKET_PRIVATE 指向公开桶属于数据事故。
      #   值来自仓库根 .env（已 gitignore）或宿主环境变量。
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      MATERIALS_DIR: /data/merchant-materials
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET_PUBLIC: ${COS_BUCKET_PUBLIC:-}
      COS_BUCKET_PRIVATE: ${COS_BUCKET_PRIVATE:-}
    volumes:
      # E12 · 入驻资质材料私有卷（读取一律走鉴权端点，不挂公开路径）
      - merchant-materials:/data/merchant-materials
    ports:
      - '8081:8081'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  duoduo-product-app:
    container_name: duoduo-app-product
    image: duoduo/duoduo-product:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: duoduo-product/target/duoduo-product-1.0.0.jar
        APP_PORT: '8082'
    restart: unless-stopped
    environment:
      DUODUO_PRODUCT_PORT: '8082'
      DB_URL: 'jdbc:mysql://mysql:3306/duoduo_product?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
      DB_USERNAME: duoduo
      DB_PASSWORD: duoduo
      NACOS_ENABLED: 'true'
      NACOS_ADDR: 'nacos:8848'
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      # 服务间调用共享密钥：保护商品服务的库存写接口（/api/products/skus/stock/**）。
      # 生产必须由外部注入真实值（compose 里只提供开发默认值）。
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-duoduo-local-dev-internal-token}
      # A10 · ES 检索：默认开启 ES 优先 + 失败降级 MySQL（ES 未启动时自动回落，
      # 搜索能力不因 ES 缺席而受损）。本地 IDE 单跑想关掉：DUODUO_SEARCH_ENABLED=false。
      # ★ E25 修正：此前写死 'true'（引号包住的字面量），于是「在 .env 里改成 false」
      #   同样**静默无效** —— 与网关那三个开关是同一类缺陷。改成 ${...:-true} 形式。
      # OPS-SWITCH 默认 true —— 关掉即搜索直接走 MySQL（ES 未起时不报错、只是少一层）
      DUODUO_SEARCH_ENABLED: ${DUODUO_SEARCH_ENABLED:-true}
      DUODUO_ES_URL: 'http://duoduo-es:9200'
      DUODUO_SEARCH_SWEEP_MS: '15000'
    ports:
      - '8082:8082'
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  duoduo-trade-app:
    container_name: duoduo-app-trade
    image: duoduo/duoduo-trade:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: duoduo-trade/target/duoduo-trade-1.0.0.jar
        APP_PORT: '8083'
    restart: unless-stopped
    environment:
      DUODUO_TRADE_PORT: '8083'
      DB_URL: 'jdbc:mysql://mysql:3306/duoduo_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
      DB_USERNAME: duoduo
      DB_PASSWORD: duoduo
      NACOS_ENABLED: 'true'
      NACOS_ADDR: 'nacos:8848'
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-duoduo-local-dev-internal-token}
      # A11 · 削峰队列：默认 sync（与 A11 之前行为一致，CI/本地零 MQ 依赖）。
      # 生产切 queue：DUODUO_TRADE_ORDER_MODE=queue + 起 mq profile（rocketmq 两容器）。
      # OPS-SWITCH 模式开关：sync / queue —— 切 queue 必须先起 mq profile，否则下单无处投递
      DUODUO_TRADE_ORDER_MODE: ${DUODUO_TRADE_ORDER_MODE:-sync}
      ROCKETMQ_NAMESRV: ${ROCKETMQ_NAMESRV:-rocketmq-namesrv:9876}
      # Sentinel 限流：下单入口 QPS 上限（同步与队列端点共用），运维可调
      # OPS-SWITCH 阈值：下单入口 QPS 上限（调小即限流更早介入）
      DUODUO_TRADE_PLACE_QPS: ${DUODUO_TRADE_PLACE_QPS:-100}
      # A14 · 秒杀 Redis（原子预扣挡量；Redis 不可用时 SeckillService 自动降级纯 DB 路径）
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # ------------------------------------------------------------------
      # 微信支付（2026-10-18）：全部走宿主机环境变量或 .env，值不落在仓库里。
      # 启用步骤：
      #   1) WECHAT_PAY_ENABLED=true + 填齐下面所有凭据；
      #   2) PAY_DEFAULT_CHANNEL 改成 WECHAT_NATIVE（生产）或保持 SANDBOX（联调对照）；
      #   3) WECHAT_PAY_NOTIFY_URL 用公网 https 回调地址（联调期填内网穿透域名）。
      # 注意：穿透的免费域名重启会变，变了要同步改 NOTIFY_URL 与商户平台配置。
      # ------------------------------------------------------------------
      PAY_DEFAULT_CHANNEL: ${PAY_DEFAULT_CHANNEL:-SANDBOX}
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-false}
      WECHAT_PAY_APPID: ${WECHAT_PAY_APPID:-}
      WECHAT_PAY_MCHID: ${WECHAT_PAY_MCHID:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PRIVATE_KEY_PEM: ${WECHAT_PAY_PRIVATE_KEY_PEM:-}
      WECHAT_PAY_MERCHANT_SERIAL_NO: ${WECHAT_PAY_MERCHANT_SERIAL_NO:-}
      WECHAT_PAY_PLATFORM_CERT_PEM: ${WECHAT_PAY_PLATFORM_CERT_PEM:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_PAY_H5_WAP_URL: ${WECHAT_PAY_H5_WAP_URL:-}
      WECHAT_PAY_H5_WAP_NAME: ${WECHAT_PAY_H5_WAP_NAME:-多多宠物商店}
      WECHAT_PAY_EXPIRE_MINUTES: ${WECHAT_PAY_EXPIRE_MINUTES:-15}
    ports:
      - '8083:8083'
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # 履约服务（M11/P2-1）：评价与晒单。读订单事实靠内部凭据调交易服务，故依赖 trade 健康。
  duoduo-fulfilment-app:
    container_name: duoduo-app-fulfilment
    image: duoduo/duoduo-fulfilment:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: duoduo-fulfilment/target/duoduo-fulfilment-1.0.0.jar
        APP_PORT: '8084'
    restart: unless-stopped
    environment:
      DUODUO_FULFILMENT_PORT: '8084'
      DB_URL: 'jdbc:mysql://mysql:3306/duoduo_fulfilment?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
      DB_USERNAME: duoduo
      DB_PASSWORD: duoduo
      NACOS_ENABLED: 'true'
      NACOS_ADDR: 'nacos:8848'
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-duoduo-local-dev-internal-token}
      # 图片上传落盘目录（A15）：指向卷挂载点，容器重建后图片不丢
      UPLOADS_DIR: /data/uploads
      # S9 · 存储介质：local（默认，本地盘卷）| cos（腾讯云公开读桶）。
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET_PUBLIC: ${COS_BUCKET_PUBLIC:-}
      COS_BUCKET_PRIVATE: ${COS_BUCKET_PRIVATE:-}
      # ★ 切到 cos 后必须把这一项设为公开桶域名
      #   （https://<bucket>.cos.<region>.myqcloud.com）：
      #   上传返回的图片 URL = 这个 base + /uploads/<uuid>.<ext>。
      #   留空时按请求的 X-Forwarded-* 推断 —— 那样 URL 会指向应用自身，
      #   在"本地盘 + 应用出图"下是对的，在"对象存储直出"下就绕过了桶（能显示，但不是我们想要的路径）。
      UPLOADS_PUBLIC_BASE_URL: ${UPLOADS_PUBLIC_BASE_URL:-}
      # 图片处理参数（数据万象 imageMogr2）。留空 = 原图直出。
      #   ★ 只在 STORAGE_TYPE=cos 时配置；格式是「?imageMogr2/...」，含 "?"，别漏。
      #   GIF 由代码强制跳过（转 WebP 会让动图变静图）。
      UPLOADS_IMAGE_SUFFIX: ${UPLOADS_IMAGE_SUFFIX:-}
    volumes:
      # 上传图片持久化：本地盘存储是对象存储接入前的过渡态，卷挂载保证生命周期独立于容器
      - fulfilment-uploads:/data/uploads
    ports:
      - '8084:8084'
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      duoduo-trade-app:
        condition: service_healthy

  # 营销服务（A5）：优惠券。被交易域单向依赖（下单锁券 / 支付核销 / 关单解锁），自己不调别人。
  duoduo-marketing-app:
    container_name: duoduo-app-marketing
    image: duoduo/duoduo-marketing:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: duoduo-marketing/target/duoduo-marketing-1.0.0.jar
        APP_PORT: '8085'
    restart: unless-stopped
    environment:
      DUODUO_MARKETING_PORT: '8085'
      DB_URL: 'jdbc:mysql://mysql:3306/duoduo_marketing?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
      DB_USERNAME: duoduo
      DB_PASSWORD: duoduo
      NACOS_ENABLED: 'true'
      NACOS_ADDR: 'nacos:8848'
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      # 服务间调用共享密钥：保护内部锁券 / 核销 / 解锁接口
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-duoduo-local-dev-internal-token}
      # 券锁定保留时长（分钟）。必须**略大于**交易域的订单超时关单时长（默认 30），
      # 否则会出现「订单还没关、券已被解锁给别人领走」。
      COUPON_LOCK_TTL_MINUTES: '35'
    ports:
      - '8085:8085'
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # ── AI 导购「多多」（A9，第 10 个容器）───────────────────────
  # 无状态（无数据库）：候选从商品域经内部凭据拉取，LLM 走 DashScope。
  # 本地 / CI 默认 mock 模式（不调 LLM，推荐仍来自真实商品库）；
  # 生产注入 DASHSCOPE_API_KEY 并把 DUODUO_AI_MOCK_ENABLED 置 false。
  duoduo-ai-app:
    container_name: duoduo-app-ai
    image: duoduo/duoduo-ai:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: duoduo-ai/target/duoduo-ai-1.0.0.jar
        APP_PORT: '8086'
    restart: unless-stopped
    environment:
      DUODUO_AI_PORT: '8086'
      NACOS_ENABLED: 'true'
      NACOS_ADDR: 'nacos:8848'
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-duoduo-local-dev-internal-token}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # OPS-SWITCH 模型名：换模型只改这一行（改完重建 ai 容器）
      DUODUO_AI_MODEL: ${DUODUO_AI_MODEL:-qwen-plus}
      # OPS-SWITCH 默认 true —— mock 只用于本地/CI；生产必须注入 DASHSCOPE_API_KEY 并置 false
      DUODUO_AI_MOCK_ENABLED: ${DUODUO_AI_MOCK_ENABLED:-true}
      # 对话超时（秒）。超时按 DEGRADED(503) 处理，不挂死请求线程
      # OPS-SWITCH 阈值：单次对话超时秒数（调小=更快失败，调大=更易拿到长回复）
      DUODUO_AI_TIMEOUT_SECONDS: ${DUODUO_AI_TIMEOUT_SECONDS:-15}
      # 限流阈值是**运维要按流量调的**量，与相邻变量保持一致走环境变量覆盖，
      # 不写死 —— 否则改阈值必须动 compose 文件，容器编排与调参耦合在一起。
      # OPS-SWITCH 阈值：单用户每分钟 AI 调用上限
      DUODUO_AI_RATE_LIMIT: ${DUODUO_AI_RATE_LIMIT:-20}
      # 全站总配额（第五十七轮）：单键限流防不住换 IP 刷，这一层保证总有上界。
      # OPS-SWITCH 阈值：全站每分钟 AI 调用上限
      DUODUO_AI_GLOBAL_RATE_LIMIT: ${DUODUO_AI_GLOBAL_RATE_LIMIT:-300}
      # 商品召回跨域调用的读超时（第五十七轮）：与 LLM 超时分开，避免商品域慢拖垮 AI。
      # OPS-SWITCH 阈值：商品召回读超时（毫秒）——调小即更早降级，调大即更易拿到结果
      DUODUO_AI_RECALL_READ_TIMEOUT_MS: ${DUODUO_AI_RECALL_READ_TIMEOUT_MS:-1500}
    ports:
      - '8086:8086'
    depends_on:
      nacos:
        condition: service_healthy

  # ── 社交服务（第四十七轮，第 11 个业务容器）─────────────────
  # 关注关系 / 私信与卡片消息 / 通知中心。聊天是高频读写（轮询），
  # 独立库独立进程，不拖累承载登录鉴权的 user 域主链路。
  duoduo-social-app:
    container_name: duoduo-app-social
    image: duoduo/duoduo-social:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: duoduo-social/target/duoduo-social-1.0.0.jar
        APP_PORT: '8087'
    restart: unless-stopped
    environment:
      DUODUO_SOCIAL_PORT: '8087'
      DB_URL: 'jdbc:mysql://mysql:3306/duoduo_social?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
      DB_USERNAME: duoduo
      DB_PASSWORD: duoduo
      NACOS_ENABLED: 'true'
      NACOS_ADDR: 'nacos:8848'
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      # 服务间调用共享密钥（交易域 / 履约域推送订单、售后、物流通知）
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-duoduo-local-dev-internal-token}
      # 私信频控：同一会话窗口期内最多发送条数（防骚扰）
      SOCIAL_MSG_RATE_WINDOW: '60'
      SOCIAL_MSG_RATE_LIMIT: '10'
    ports:
      - '8087:8087'
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy

  # ── Elasticsearch（A10，可选加速层，profile=search）────────
  # 刻意挂 profile：`docker compose up` 默认**不启动** ES ——
  # CI 与零依赖环境无需 ES（检索自动降级回 MySQL，验收④）；
  # 本地要启用：`docker compose --profile search up -d duoduo-es`。
  # 官方镜像 + 应用侧拼音生成，不装插件 —— 不引入「插件装失败→起不来」的运维面。
  duoduo-es:
    container_name: duoduo-es
    image: docker.io/library/elasticsearch:8.11.4
    profiles: ["search"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ── A11 · RocketMQ（削峰队列，可选容器，挂 mq profile）─────────────
  # 刻意挂 profile：`docker compose up` 默认不启动 —— trade 默认 sync 模式，
  # 不依赖 MQ（CI 与零依赖环境照常跑）。启用：`docker compose --profile mq up -d`
  # 并把 DUODUO_TRADE_ORDER_MODE=queue 重建 trade。
  # brokerIP1 指向服务名：broker 会把自己的地址注册进 NameServer，
  # 客户端（trade 容器）拿到的必须是 compose 网络内可达的名字，写宿主 IP 会连不上。
  rocketmq-namesrv:
    container_name: duoduo-mq-namesrv
    image: apache/rocketmq:5.3.2
    profiles: ["mq"]
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      # 官方脚本默认 -Xms4g，开发机扛不住；用 JAVA_OPT_EXT 覆盖为小内存
      JAVA_OPT_EXT: '-Xms256m -Xmx256m -Xmn128m'
    ports:
      - '9876:9876'
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n 127.0.0.1:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  rocketmq-broker:
    container_name: duoduo-mq-broker
    image: apache/rocketmq:5.3.2
    profiles: ["mq"]
    restart: unless-stopped
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    environment:
      JAVA_OPT_EXT: '-Xms512m -Xmx512m -Xmn256m'
    volumes:
      - ./docs/mq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    ports:
      - '10909:10909'
      - '10911:10911'
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin brokerStatus -n rocketmq-namesrv:9876 -b 127.0.0.1:10911 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  duoduo-gateway-app:
    container_name: duoduo-app-gateway
    image: duoduo/duoduo-gateway:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: duoduo-gateway/target/duoduo-gateway-1.0.0.jar
        APP_PORT: '8080'
    restart: unless-stopped
    environment:
      DUODUO_GATEWAY_PORT: '8080'
      NACOS_ENABLED: 'true'
      NACOS_ADDR: 'nacos:8848'
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      DUODUO_JWT_SECRET: ${DUODUO_JWT_SECRET:-duoduo-local-dev-secret-please-change-in-production-32b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # E17 · 权限版本副本（用户服务写、网关读）。读不到一律放行，故不是硬依赖，
      # 但一起起来才能让「改完角色下一个请求即生效」这条链路在容器里可验证。
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # ---- 认证链路上的开关（排障 / 回滚用，每个都必须是 ${NAME:-默认} 形式）----
      #
      # ★ 为什么这一段值得单独写：E25 逐条核实时发现，上面这些开关**代码里都有字段、
      #   yml 里也都有 `${...}`**，但**只有 permVersion 这一条真的能被 compose 透传**。
      #   其余三条的表现是「在 `.env` 里改了、重启了、行为没变」——
      #   而它不会报错、不会告警，只会在某次排障时把人耗掉半小时。
      #   `scripts/ops-switch.ps1 -Check` 会把这件事变成一条断言（逐开关核到本文件里
      #   确实写了 `${NAME:-…}`），否则「有开关」永远只是一句说法。
      # 一键退回旧行为（等令牌自然过期）的开关；排障用，平时不要动
      # OPS-SWITCH 默认 true —— 关掉 = 角色变更要等令牌自然过期（≤15 分钟）才生效
      DUODUO_PERM_VERSION_ENABLED: ${DUODUO_PERM_VERSION_ENABLED:-true}
      # E8 · 入口收窄（按入口裁剪 /api/admin/** 与 /api/seller/**）总开关
      # OPS-SWITCH 默认 true —— 关掉 = 三个入口不再互相隔离（排障用，等于放开跨端访问）
      DUODUO_ENTRY_SCOPE_ENABLED: ${DUODUO_ENTRY_SCOPE_ENABLED:-true}
      # E24 · 租户接口调用计数（健康度面板第四维的数据源）。关掉 = 那一维恒 0 且无报错
      # OPS-SWITCH 默认 true —— 关掉只会让面板那一维恒 0，不会报错（典型静默失效）
      DUODUO_API_METRICS_ENABLED: ${DUODUO_API_METRICS_ENABLED:-true}
      # E21 · 后台 IP 白名单。默认关；打开且名单为空 = 拒绝全部后台访问（失败关闭）
      # OPS-SWITCH 默认 false —— 打开前必须先把名单配全，否则**所有人**进不了后台
      DUODUO_ADMIN_IP_WHITELIST_ENABLED: ${DUODUO_ADMIN_IP_WHITELIST_ENABLED:-false}
      # 逗号分隔的来源清单：精确地址 / CIDR / 前缀通配，如 "203.0.113.7,10.0.0.0/8"
      # OPS-SWITCH 名单（不是布尔开关）：仅在上一条打开时生效
      DUODUO_ADMIN_IP_WHITELIST: ${DUODUO_ADMIN_IP_WHITELIST:-}
    ports:
      - '8080:8080'
    depends_on:
      redis:
        condition: service_healthy
      duoduo-user-app:
        condition: service_healthy
      duoduo-product-app:
        condition: service_healthy
      duoduo-trade-app:
        condition: service_healthy
      duoduo-fulfilment-app:
        condition: service_healthy
      duoduo-marketing-app:
        condition: service_healthy
      duoduo-ai-app:
        condition: service_healthy

  # ---------- 网页端「正式版」容器（S1） ----------
  #
  # 为什么要它：此前网页只能靠开发模式（vite dev server）访问，需要开命令行窗口，
  # 且那种服务随会话关闭就被回收（用户点开链接看到"无法访问"）。
  # 本服务把打包好的静态页交给 nginx，并**同源反代** /api 与 /sandbox 到网关：
  #   · 一条 `docker compose up -d` 即可长期使用，不再依赖任何命令行窗口；
  #   · 浏览器始终同源 → httpOnly Cookie 正常、无跨域预检、**后端 CORS 白名单无需改动**。
  duoduo-web-app:
    container_name: duoduo-app-web
    image: duoduo/duoduo-web:1.0.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: mall
        NGINX_CONF: nginx.conf
    restart: unless-stopped
    ports:
      - '8088:80'
    # 网关没有定义 healthcheck，所以这里用 service_started（用 service_healthy 会直接报错）
    depends_on:
      duoduo-gateway-app:
        condition: service_started

  # ---------- 平台管理后台站点（T-ARCH：独立端口 + 独立主机名 + 独立登录） ----------
  #
  # 为什么要独立容器：主平台不应依赖商城网站登录。两边用**不同主机名**
  # （商城 localhost:8088 / 后台 admin.localhost:8090）——
  # Cookie 是主机级作用域且**不区分端口**，只有换主机名才能做到"登录态互不共享"。
  # E7-2：后台已是**独立应用**（apps/admin），只构建自己的源码、只装自己的 dist。
  duoduo-admin-web-app:
    container_name: duoduo-app-admin-web
    image: duoduo/duoduo-web:1.0.0-admin
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: admin
        NGINX_CONF: nginx-admin.conf
    restart: unless-stopped
    ports:
      - '8090:80'
    depends_on:
      duoduo-gateway-app:
        condition: service_started

  # ---------- 第三方商家平台站点（E6：独立端口 + 独立主机名 + 独立登录） ----------
  # E7-2：商家已是**独立应用**（apps/merchant，含 pages/merchant 与 pages/seller）。
  duoduo-merchant-web-app:
    container_name: duoduo-app-merchant-web
    image: duoduo/duoduo-web:1.0.0-merchant
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP: merchant
        NGINX_CONF: nginx-merchant.conf
    restart: unless-stopped
    ports:
      - '8091:80'
    depends_on:
      duoduo-gateway-app:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
  fulfilment-uploads:
  # E12 · 入驻资质材料的私有存储：不挂任何公开 nginx 路径，
  # 读取一律走鉴权端点（店主本人 / 运营），与公开的 /uploads/** 彻底分开
  merchant-materials:
