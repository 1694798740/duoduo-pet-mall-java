# 多多宠物商店 · 基础设施编排
#
# 说明：本文件提供「真微服务多进程」所需的中间件。
# 本机未安装 Docker Desktop 时无法使用；此时请用 application-local.yaml（H2 + 关闭 Nacos）跑骨架，
# 或参考 docs/LOCAL-SETUP.md 的原生安装方式。
#
# 用法：
#   docker compose up -d
#   docker compose logs -f nacos
#
# 生产环境请勿直接使用此文件：账号口令、资源规格、持久化与高可用策略都需要按容量重新设计。

services:
  mysql:
    image: mysql:8.0.36
    container_name: duoduo-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-duoduo_root}
      MYSQL_DATABASE: duoduo_user
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      # 生产应由 DBA 按容量重新设定，这里取开发默认值
      - --max-connections=2000
      - --innodb-buffer-pool-size=1G
      - --slow-query-log=ON
      - --long-query-time=0.2
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${MYSQL_ROOT_PASSWORD:-duoduo_root}']
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: duoduo-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '2gb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: duoduo-nacos
    restart: unless-stopped
    ports:
      - '8848:8848'
      - '9848:9848'
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-duoduo_root}
      JVM_XMS: 512m
      JVM_XMX: 512m
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8848/nacos/v1/console/health/readiness']
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:
