server:
  # 注意：不要用 TRADE_PORT 这类通用名，宿主/CI 环境可能已占用该变量名而静默改写端口
  port: ${DUODUO_TRADE_PORT:8083}
  shutdown: graceful
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 1000
    max-connections: 10000

spring:
  application:
    name: duoduo-trade
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/duoduo_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:duoduo}
    password: ${DB_PASSWORD:duoduo}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 20
      maximum-pool-size: 100
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: duoduo-trade-pool
  sql:
    init:
      # 表结构由 DDL 统一管理（docs/sql/03-duoduo-trade.sql 或 db/schema.sql），
      # 绝不能在启动时自动执行 —— schema.sql 内有 DROP TABLE。
      mode: never

  # A14 · 秒杀用 Redis（原子预扣挡量）。连接失败不影响启动：
  # SeckillService 对 Redis 全链路 try/catch 降级，正确性由 DB 原子扣减兜底。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 本机零依赖开发没起 Redis 时也不能拖死请求：连接/命令超时都要短
      timeout: 500ms
      connect-timeout: 500ms

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input

duoduo:
  id:
    datacenter-id: ${ID_DATACENTER:1}
    worker-id: ${ID_WORKER:3}
  internal:
    # 服务间调用共享密钥，与商品服务共用同一个值（容器里由 INTERNAL_TOKEN 注入）。
    # 用于调用商品服务的库存写接口（冻结 / 释放 / 扣减）。
    token: ${INTERNAL_TOKEN:duoduo-local-dev-internal-token}
  trade:
    # 待付款订单多久自动关单（分钟）。生产按业务口径核定，这里取 30 分钟。
    order-expire-minutes: ${ORDER_EXPIRE_MINUTES:30}
    # 关单扫描与库存冻结释放的调度间隔（毫秒）；单实例开发环境用默认值，
    # 生产由 XXL-Job 接管，避免多实例重复执行。
    sweep-interval-ms: ${SWEEP_INTERVAL_MS:60000}
    # 启动后多久开始第一轮扫描（给服务预热留时间）
    sweep-initial-delay-ms: ${SWEEP_INITIAL_DELAY_MS:30000}
    # 单次扫描最多处理多少条，防止一次拉太多把库压住
    sweep-batch-size: ${SWEEP_BATCH_SIZE:200}
    # 每个订单最多包含多少种商品，防止恶意大单
    max-items-per-order: ${MAX_ITEMS_PER_ORDER:50}
    # 单个 SKU 单次最多购买数量
    max-quantity-per-sku: ${MAX_QTY_PER_SKU:200}
    # 平台佣金费率（基点，1 bp = 万分之一）。100 bp = 1%；配 0 即免佣。
    # 佣金从托管金额里扣，余下打给卖家；历史单据保留结算当刻的口径，不随费率调整而变。
    platform-fee-bps: ${PLATFORM_FEE_BPS:100}
    # 发货后多少天自动确认收货并放款给卖家；配 0 或负数即关闭（仅手动确认收货）
    auto-receipt-days: ${AUTO_RECEIPT_DAYS:7}
    # ── A11 · 削峰队列（RocketMQ）────────────────────────────
    # order-mode=queue：POST /api/orders/queued 入队，消费者异步执行与同步端点
    #   完全相同的 placeOrder（幂等/状态机代码级复用）；sync（默认）：MQ 相关 Bean
    #   不创建，行为与 A11 之前完全一致 —— CI 与本地开发零依赖 MQ。
    order-mode: ${DUODUO_TRADE_ORDER_MODE:sync}
    mq:
      namesrv: ${ROCKETMQ_NAMESRV:rocketmq-namesrv:9876}
      topic: ${ROCKETMQ_ORDER_TOPIC:duoduo-order-place}
      consumer-group: ${ROCKETMQ_ORDER_GROUP:duoduo-trade-order-place}
      # 消费失败（系统类异常）的最大重试次数；耗尽后由 broker 移入死信 %DLQ%<consumer-group>
      max-reconsume: ${ROCKETMQ_MAX_RECONSUME:2}
    # Sentinel 限流：下单入口 QPS 上限（同步与队列端点共用同一资源「order-place」）。
    # 触发后返回全站既有 RATE_LIMITED(429)。压测/冒烟可用环境变量调低验证 429 路径。
    place-qps-limit: ${DUODUO_TRADE_PLACE_QPS:100}
  pay:
    sandbox:
      # 沙箱收银台地址（预下单返回的二维码内容指向这里）。
      # 二维码会被任一扫码设备打开，所以必须走**网关**（唯一对外入口，8080），
      # 不能填交易服务的直连端口（8083，宿主未必映射到扫码设备可达的地址）。
      # 扫码设备必须能访问该地址：本机开发用 127.0.0.1，容器对外/联机时用宿主 IP。
      cashier-url: ${SANDBOX_CASHIER_URL:http://127.0.0.1:8080/sandbox/pay}
      # 回调验签密钥（HMAC-SHA256）。本地开发有默认值，生产必须用环境变量覆盖
      callback-secret: ${SANDBOX_CALLBACK_SECRET:duoduo-sandbox-pay-secret}
      # 支付单有效期（分钟）：过期后二维码作废，由补偿调度置为 EXPIRED
      expire-minutes: ${SANDBOX_EXPIRE_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.duoduo: INFO
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"duoduo-trade","requestId":"%X{requestId}","logger":"%c{1}","msg":"%replace(%m){''"'',''\\"''}","thread":"%t"}%n'

# ── OpenAPI 契约（A6）────────────────────────────────────────────
# 随 duoduo-common-web 的 knife4j starter 自动装配，导出 /v3/api-docs 供契约比对与前端联调。
# 安全边界：网关路由是显式前缀白名单，/v3/api-docs 与 /doc.html 不会被路由到公网入口；
# 服务直连端口（8081~8085）仅本机/内网可达。生产若要彻底关闭，把 enabled 置 false 即可。
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false
knife4j:
  enable: true
  setting:
    language: zh_cn
