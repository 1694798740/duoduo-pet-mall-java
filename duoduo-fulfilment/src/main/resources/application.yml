server:
  # 不要用 FULFIL_PORT 这类通用名，宿主/CI 环境可能已占用该变量名而静默改写端口
  port: ${DUODUO_FULFILMENT_PORT:8084}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 30
    accept-count: 500
    max-connections: 5000

spring:
  application:
    name: duoduo-fulfilment
  lifecycle:
    timeout-per-shutdown-phase: 20s

  servlet:
    multipart:
      # 上传上限 = 业务上限(5MB) + multipart 编码开销的余量；超了由 UploadController 给友好文案
      max-file-size: ${UPLOADS_MAX_FILE:6MB}
      max-request-size: ${UPLOADS_MAX_REQUEST:12MB}

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/duoduo_fulfilment?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:duoduo}
    password: ${DB_PASSWORD:duoduo}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: duoduo-fulfilment-pool
  sql:
    init:
      # 表结构由 DDL 统一管理（docs/sql/04-duoduo-fulfilment.sql 或 db/schema.sql），
      # 绝不能在启动时自动执行 —— schema.sql 里有 DROP TABLE。
      mode: never

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input

duoduo:
  id:
    datacenter-id: ${ID_DATACENTER:1}
    worker-id: ${ID_WORKER:4}
  internal:
    # 服务间调用共享密钥（调交易域的内部订单查询接口）
    token: ${INTERNAL_TOKEN:duoduo-local-dev-internal-token}
    # 服务间调用凭据（第五十八轮 P0-3）：签名有效期（秒）与「每个调用方一把显式密钥」。
    # 两者都可不配：默认 300 秒，且密钥按调用方身份从根密钥派生（见 InternalCallAuth）。
    signature-skew-seconds: ${INTERNAL_SKEW_SECONDS:300}
    caller-secrets: ${INTERNAL_CALLER_SECRETS:}
  uploads:
    # 图片落盘目录（A15）。容器里通过卷挂载持久化，见 docker-compose.yml
    dir: ${UPLOADS_DIR:./data/uploads}
    # 拼图片对外 URL 的 base。留空 = 按请求的 X-Forwarded-*（网关场景）或 Host（直连调试）推断；
    # 生产若图片走独立域名 / CDN，在这里配（如 https://img.example.com）
    public-base-url: ${UPLOADS_PUBLIC_BASE_URL:}
    # 图片处理参数（数据万象 imageMogr2），拼在上传返回的 URL 末尾。留空 = 完全不处理（默认）。
    # 例：?imageMogr2/auto-orient/thumbnail/1600x1600>/format/webp/quality/82/strip
    #   auto-orient  先按 EXIF 纠正方向 —— 必须排在 strip 之前，否则手机竖拍图会躺倒
    #   thumbnail/>  长边压到 1600 且只缩不放（小图不会被拉糊）
    #   format/webp  同画质下比 JPEG 再小 25%~35%，且支持透明通道（PNG 转 JPEG 会变黑底）
    #   quality/82   视觉无损区间；低于 70 才开始出现可察觉的块效应
    #   strip        去 EXIF/ICC 等元信息，通常再省 10~30KB
    # ★ 只对 COS 后端有意义；本地盘模式请留空，否则 URL 会带一串无效参数。
    # ★ GIF 由代码强制跳过：format/webp 会把动图压成静图。
    image-suffix: ${UPLOADS_IMAGE_SUFFIX:}
    # 单图大小上限（MB）。0 表示不限制（仍受 spring.servlet.multipart 硬顶约束）
    max-size-mb: ${UPLOADS_MAX_MB:5}
  storage:
    # S9 · 存储介质。local（默认，本地盘）| cos（腾讯云对象存储）。
    # ★ 默认必须是 local：新存储层一旦有问题，改回这一行重启即可回退；
    #   同时本地盘是 CI / 开发环境（没有桶、没有密钥）唯一可用的后端。
    # type=cos 但下面 5 个键没配全时，服务**回落 local 并打 WARN（点名缺哪个）**，不会启动失败。
    type: ${STORAGE_TYPE:local}
    cos:
      # 子用户密钥（★ 不要用主账号密钥）。只授「两个桶的对象级
      # PutObject/GetObject/HeadObject/DeleteObject」，不授列举桶、不授桶级 cos:*。
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      region: ${COS_REGION:}
      # 公开读桶（商品图 / 评价晒图 / 售后举证图），本服务只用这一个
      bucket-public: ${COS_BUCKET_PUBLIC:}
      # 私有桶（入驻资质材料）由用户域使用；本服务不读它，但配置项保持齐全，
      # 避免"两个服务各配一半、切环境时漏一个"这类问题。
      bucket-private: ${COS_BUCKET_PRIVATE:}
  review:
    # 评价内容最大长度（与 DDL 的 VARCHAR(1000) 对齐）
    max-content-length: ${REVIEW_MAX_CONTENT:1000}
    # 单条评价最多几张图
    max-images: ${REVIEW_MAX_IMAGES:9}
    # 追评窗口：确认收货后多少天内可追评（0 表示不限期）
    append-window-days: ${REVIEW_APPEND_DAYS:30}
    # A-16 商家回复最大长度（与 DDL 的 VARCHAR(500) 对齐）。一条评价只允许一次回复
    max-reply-length: ${REVIEW_MAX_REPLY:500}
    # A-15 机审敏感词（逗号 / 顿号分隔，可留空）。
    # 除词表外，服务内置联系方式、站外链接、导流话术、违禁品四类规则；
    # 命中只转人工 PENDING，不自动下架。词表放配置而不是库表：
    # 它变更频率低、需要随版本回滚，运营也不该为了改几个词开一次库。
    sensitive-words: ${REVIEW_SENSITIVE_WORDS:}
  aftersale:
    # 售后举证图最多几张。刻意少于评价的 9 张：举证要的是「看得清问题」的关键几张，
    # 不是图集。放开到 9 张只会让运营的裁定工作台变成图片墙。
    max-images: ${AFTERSALE_MAX_IMAGES:6}
  credit:
    # ---- 信用分权重表（A4）----
    # 四个数之和必须 == 100，否则服务启动即失败（明细与总分必须自洽，见 CreditModel）。
    # 有效取值区间为 [base, 100]：因子非负且满和 100，故默认落在 60~100。
    base: ${CREDIT_BASE:60}
    weight-completion: ${CREDIT_W_COMPLETION:18}
    weight-review: ${CREDIT_W_REVIEW:16}
    weight-aftersale: ${CREDIT_W_AFTERSALE:6}
    # ---- 定时回写（默认关闭）----
    # 它会把分数写进用户库，属后台写操作；开发/自测期间开着会让断言时好时坏。
    # 需要时设 CREDIT_REFRESH_ENABLED=true 打开，再按需调间隔。
    refresh-enabled: ${CREDIT_REFRESH_ENABLED:false}
    refresh-interval-ms: ${CREDIT_REFRESH_INTERVAL_MS:900000}
    refresh-initial-delay-ms: ${CREDIT_REFRESH_INITIAL_DELAY_MS:120000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.duoduo: INFO
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"duoduo-fulfilment","requestId":"%X{requestId}","logger":"%c{1}","msg":"%replace(%m){''"'',''\\"''}","thread":"%t"}%n'

# ── OpenAPI 契约（A6）────────────────────────────────────────────
# 随 duoduo-common-web 的 knife4j starter 自动装配，导出 /v3/api-docs 供契约比对与前端联调。
# 安全边界：网关路由是显式前缀白名单，/v3/api-docs 与 /doc.html 不会被路由到公网入口；
# 服务直连端口（8081~8085）仅本机/内网可达。生产若要彻底关闭，把 enabled 置 false 即可。
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false
knife4j:
  enable: true
  setting:
    language: zh_cn
