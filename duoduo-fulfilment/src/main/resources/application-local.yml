# 本地零依赖运行（H2 内存库 + 关闭 Nacos）：
#   java -jar duoduo-fulfilment.jar --spring.profiles.active=local
# 表结构每次启动重建（评价库无种子数据，评价由接口产生），保证演示环境可重复。
spring:
  datasource:
    url: jdbc:h2:mem:duoduo_fulfilment;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    nacos:
      discovery:
        enabled: false

# 注：关闭 Nacos 时无法解析 duoduo-trade 服务名，评价校验需要交易服务可达。
# 本档仅用于「评价库与接口」的离线验证；完整链路请用容器编排（docker compose）。
logging:
  level:
    com.duoduo: DEBUG
