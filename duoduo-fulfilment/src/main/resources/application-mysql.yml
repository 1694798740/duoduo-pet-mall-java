# MySQL 数据源档（与 local 档组合，用于「真实 MySQL + 无注册中心」的本地验证）：
#   java -jar duoduo-fulfilment.jar --spring.profiles.active=local,mysql
#
# 本档只覆盖数据源；生产直接用默认档（DB_URL / DB_USERNAME / DB_PASSWORD 环境变量）。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/duoduo_fulfilment?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: duoduo
    password: duoduo
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 30
      connection-timeout: 3000
      pool-name: duoduo-fulfilment-mysql-pool
  sql:
    init:
      mode: never

logging:
  level:
    com.duoduo: DEBUG
