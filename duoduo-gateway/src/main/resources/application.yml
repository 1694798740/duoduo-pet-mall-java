server:
  # 注意：避免使用 GATEWAY_PORT 这类通用名，防止被宿主环境的同名变量覆盖
  port: ${DUODUO_GATEWAY_PORT:8080}
  shutdown: graceful
  netty:
    connection-timeout: 5s

spring:
  application:
    name: duoduo-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # E17 · 权限版本的感知副本（用户服务写入，网关只读）。
  # 只在"令牌声明了 pv"时才读一次，老令牌不读。连不上不影响启动、不影响放行：
  # RedisPermVersionChecker 全程 onErrorResume 成"未知"，最坏是每个请求多花 150ms。
  # 超时必须给短：本机零依赖开发没起 Redis 时，也不能让登录/鉴权链路等 TCP 超时。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 300ms
      connect-timeout: 300ms

  cloud:
    nacos:
      discovery:
        # 本地未启动 Nacos 时，用 --spring.profiles.active=local 关闭（见 application-local.yml）
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            # E8 · CORS 白名单按"谁的页面会跨域调网关"列：三个站点的 **dev server**（5173/5180/5190）
            # 与历史 dev 端口 3000。生产三站点是同源部署（各自 nginx 反代 /api），浏览器请求根本
            # 不产生跨域 —— 这份白名单只服务开发态与"把网关直接暴露出去"的场景。
            # ★ 三个正式站点主机名（localhost:8088 / admin.localhost:8090 / merchant.localhost:8091）
            #   刻意**不**进这份名单：它们是同源访问，把站点本身写进 CORS 白名单
            #   只会让"白名单"慢慢变成"全站点名册"。
            allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5180,http://localhost:5190}
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: '*'
            exposed-headers: [X-Request-Id]
            allow-credentials: true
            max-age: 600
      routes:
        - id: duoduo-user
          uri: lb://duoduo-user
          predicates:
            # /api/addresses/** = 收货地址簿（A8）。必须显式列出：
            #   本路由是按具体子路径列举的（不是 /api/users/** 兜底），
            #   漏了这一段不会被报错，只会 404 —— 最难发现的一类配置缺失。
            #   与 /api/users/** 同样**不进白名单**（需登录）：地址簿里是全站最敏感的个人信息之一，
            #   而归属校验依赖 X-User-*，不登录的话服务端根本无从判断归属。
            # /api/admin/users/** = 运营账号管理（A7）。同样必须显式列出（漏了只会 404）：
            #   用户与角色数据就在用户库，运营管理视图落回 user 服务；不进白名单（需登录，
            #   operator/admin 角色由服务端 OperatorGuard + 仅 ADMIN 可改角色两层把关）。
            # /api/seller/staff/** = 店员管理（E13）：落在 user 服务（成员是账号域事实），
            #   必须列在 trade 的 /api/seller/** 兜底**之前** —— 不加这段会被 trade 捕获后 404
            #   （与 product 的 /api/seller/products 同一优先级陷阱）
            - Path=/api/auth/**,/api/users/**,/api/pets/**,/api/addresses/**,/api/admin/users/**,/api/admin/merchants/**,/api/admin/merchant-staff/**,/api/merchant-materials/**,/api/seller/staff,/api/seller/staff/**
        # 以下路由在后续阶段的服务建好后启用（当前未部署会返回 503，属预期）
        - id: duoduo-product
          uri: lb://duoduo-product
          predicates:
            # /api/seller/products/** = 商家端商品管理（M9 商品侧）。
            # 必须排在 trade 路由之前：/api/seller/** 会被 trade 兜底捕获，
            # 商品管理要落到 product 服务（归属判断靠 X-User-*，也是服务端责任）
            # /api/admin/{categories,brands,listings} = 平台管理后台（M10）的类目/品牌/审核，
            # 数据在商品库，运营接口本质是商品域数据的「管理视图」，落回 product 服务最自然
            # /api/admin/search/** = 检索对账（A10）：ES 索引与库差异报告 + 重建，数据在商品域
            # /api/listings/** = C2C 闲置全部读写（search 列表 / {id} 详情 / 发布 / mine/list / {id}/status）。
            # 路由用通配没问题，但**白名单绝不能跟着写通配** —— 白名单不区分方法，
            # /api/listings/** 会把发布写端点一起放行（详见 GatewaySecurityProperties 的 listings 段注释）
            # /api/admin/products/** = 第三方商品上架审核台（E14）：商品数据在商品库，
            #   必须显式列出（本路由是按具体子路径列举的，不是 /api/admin/** 兜底，
            #   漏了这段会静默 404 而不是报错）。不进白名单：运营审核必须登录，
            #   权限由服务端 OperatorGuard 把关（网关那层只管登录与入口收窄）。
            # /api/admin/audit-sla/** = 审核 SLA 事后抽查（E28）：抽查任务表在商品库，
            #   同样必须显式列出（本路由是按具体子路径列举的，不是 /api/admin/** 兜底）。
            #   漏了它不会报错，只会静默 404 —— 这类"路由漏列"本项目已经踩过两次。
            - Path=/api/categories/**,/api/products/**,/api/seller/products/**,/api/listings/**,/api/home/**,/api/meta/**,/api/admin/categories/**,/api/admin/brands/**,/api/admin/listings/**,/api/admin/products/**,/api/admin/search/**,/api/admin/audit-sla/**
        - id: duoduo-trade
          uri: lb://duoduo-trade
          predicates:
            # /api/seller/** = 卖家中心（M5-9），由网关鉴权 + 服务端归属校验保护，
            # 不进白名单 —— 不登录就拿不到 X-User-*，服务端无从判断归属
            # /api/admin/{orders,settlements,reports} = 平台管理后台（M10）的订单干预/对账/报表，
            # 数据在交易库，落回 trade 服务；同样不进白名单（operator 角色由服务端校验）
            # /api/admin/mq/** = 死信查询与重放（A11）：数据与消费组都在交易域，
            #   必须显式列出（product / trade 的路由按具体子路径列举，不是 /api/admin/** 兜底），
            #   漏了会被路由到 404 而不是报错（02 篇显式列举纪律的既有案例）
            # /api/seckill/** 与 /api/admin/seckill/** = 限时秒杀（A14）：活动表与配额在交易库。
            #   列表/详情不进白名单（网关统一鉴权，未登录只影响下单不影响浏览看实现取舍，
            #   这里与 cart/orders 同口径处理）；下单与管理端由服务端校验登录/operator
            - Path=/api/cart/**,/api/orders/**,/api/payments/**,/api/seller/**,/sandbox/pay/**,/api/admin/orders/**,/api/admin/settlements/**,/api/admin/reports/**,/api/admin/mq/**,/api/seckill/**,/api/admin/seckill/**
        - id: duoduo-fulfilment
          uri: lb://duoduo-fulfilment
          predicates:
            # /api/aftersales/** = 售后立案 / 卖家处理 / 买家申请仲裁（A3）。
            # /api/admin/aftersales/** = 运营仲裁工作台（A3）—— 数据在履约库，
            #   必须显式列在这里：product / trade 的路由是按具体子路径列举的（不是 /api/admin/** 兜底），
            #   漏了这一段会被路由到 404，而不是报错，最不容易被发现。
            # 两段都不进白名单：售后单含买家诉求与证据，「不登录就看得到」本身就是缺陷。
            # /api/logistics/** = 物流轨迹查询（A2）—— 数据在履约库，同样必须显式列出。
            #   路径不挂在 /api/orders/** 下：那一段整段归交易域，多挂一条就要在网关里
            #   为它插一条更高优先级的路由，正是历史上造成过「新增端点只 404」的写法。
            #   也不进白名单：轨迹能反映「谁买了什么、寄到哪个城市」，属当事人信息，
            #   不登录就拿不到 X-User-*，服务端无从判断资格。
            # /api/uploads/** = 图片上传（A15），POST 需登录（不进白名单）；
            #   /uploads/** = 图片公开读（A15），<image> 标签发不出 Authorization 头，必须免登。
            #   两段必须同时列出且白名单只放 /uploads/**：白名单按路径匹配、不区分方法，
            #   若 /api/uploads/** 进白名单，匿名 POST 上传会把磁盘变成公共网盘。
            # /api/shares/** = 分享圈（第四十三轮）：发布需登录；信息流 / 详情 / 话题 / 评论列表公开读
            #   （白名单只放 /api/shares/feed、/api/shares/topics、/api/shares/topics/*、/api/shares/*
            #     四条只读路径，见安全配置注释）。
            # /api/admin/share-reports/** = 分享举报处理台（第五十六轮）—— 与 /api/admin/aftersales/**
            #   同性质：数据在履约库、必须显式列出（product / trade 的路由是按具体子路径列举的，
            #   不是 /api/admin/** 兜底，漏了这段会静默 404 而不是报错）。
            - Path=/api/aftersales/**,/api/admin/aftersales/**,/api/admin/share-reports/**,/api/reviews/**,/api/logistics/**,/api/shares/**,/api/uploads/**,/uploads/**
        - id: duoduo-marketing
          uri: lb://duoduo-marketing
          predicates:
            - Path=/api/promotions/**,/api/coupons/**
        # /api/socials/** = 社交域（第四十七轮）：关注关系 / 私信与卡片消息 / 通知中心。
        # 全部**不进白名单**：关注关系与私信是当事人数据，通知是收件人数据，
        # 「不登录就能看」本身就是缺陷，且归属判断依赖 X-User-*；
        # 唯一公开的某人粉丝/关注数（counts）挂在三段路径 /follows/{id}/counts 上，
        # 与登录路径天然分开 —— 白名单按路径匹配、不区分方法，绝不能整段放行 /api/socials/**。
        - id: duoduo-social
          uri: lb://duoduo-social
          predicates:
            - Path=/api/socials/**
        # /api/admin/** 已拆段并入 product、trade 与 user 三服务（M10 / A7）：
        # 运营管理接口本质是商品域 / 交易域 / 用户域数据的「管理视图」，数据在哪就落哪个服务，
        # 避免新建独立 admin 微服务时的跨库查询与额外 Feign 链路。
        # 若将来运营管理面需要独立扩展（如接入风控、审批流），再单独建 duoduo-admin 并回收这些路由。
        - id: duoduo-ai
          uri: lb://duoduo-ai
          predicates:
            - Path=/api/duoduo/**

duoduo:
  security:
    # 生产必须由配置中心 / 环境变量注入，禁止使用默认值
    jwt-secret: ${DUODUO_JWT_SECRET:duoduo-local-dev-secret-please-change-in-production-32b}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # E17 · 权限版本校验开关。默认开；置 false 即退回「等令牌自然过期」的旧行为（排障/回滚用）
    perm-version-enabled: ${DUODUO_PERM_VERSION_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.duoduo: INFO
    org.springframework.cloud.gateway: INFO
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"duoduo-gateway","requestId":"%X{requestId}","logger":"%c{1}","msg":"%replace(%m){''"'',''\\"''}","thread":"%t"}%n'
