server:
  # 注意：避免使用 GATEWAY_PORT 这类通用名，防止被宿主环境的同名变量覆盖
  port: ${DUODUO_GATEWAY_PORT:8080}
  shutdown: graceful
  netty:
    connection-timeout: 5s

spring:
  application:
    name: duoduo-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s

  cloud:
    nacos:
      discovery:
        # 本地未启动 Nacos 时，用 --spring.profiles.active=local 关闭（见 application-local.yml）
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: '*'
            exposed-headers: [X-Request-Id]
            allow-credentials: true
            max-age: 600
      routes:
        - id: duoduo-user
          uri: lb://duoduo-user
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/pets/**
        # 以下路由在后续阶段的服务建好后启用（当前未部署会返回 503，属预期）
        - id: duoduo-product
          uri: lb://duoduo-product
          predicates:
            # /api/seller/products/** = 商家端商品管理（M9 商品侧）。
            # 必须排在 trade 路由之前：/api/seller/** 会被 trade 兜底捕获，
            # 商品管理要落到 product 服务（归属判断靠 X-User-*，也是服务端责任）
            # /api/admin/{categories,brands,listings} = 平台管理后台（M10）的类目/品牌/审核，
            # 数据在商品库，运营接口本质是商品域数据的「管理视图」，落回 product 服务最自然
            - Path=/api/categories/**,/api/products/**,/api/seller/products/**,/api/listings/**,/api/home/**,/api/meta/**,/api/admin/categories/**,/api/admin/brands/**,/api/admin/listings/**
        - id: duoduo-trade
          uri: lb://duoduo-trade
          predicates:
            # /api/seller/** = 卖家中心（M5-9），由网关鉴权 + 服务端归属校验保护，
            # 不进白名单 —— 不登录就拿不到 X-User-*，服务端无从判断归属
            # /api/admin/{orders,settlements,reports} = 平台管理后台（M10）的订单干预/对账/报表，
            # 数据在交易库，落回 trade 服务；同样不进白名单（operator 角色由服务端校验）
            - Path=/api/cart/**,/api/orders/**,/api/payments/**,/api/seller/**,/sandbox/pay/**,/api/admin/orders/**,/api/admin/settlements/**,/api/admin/reports/**
        - id: duoduo-fulfilment
          uri: lb://duoduo-fulfilment
          predicates:
            - Path=/api/aftersales/**,/api/reviews/**
        - id: duoduo-marketing
          uri: lb://duoduo-marketing
          predicates:
            - Path=/api/promotions/**,/api/coupons/**
        # /api/admin/** 已拆段并入 product 与 trade 两服务（M10）：
        # 运营管理接口本质是商品域 / 交易域数据的「管理视图」，数据在哪就落哪个服务，
        # 避免新建独立 admin 微服务时的跨库查询与额外 Feign 链路。
        # 若将来运营管理面需要独立扩展（如接入风控、审批流），再单独建 duoduo-admin 并回收这些路由。
        - id: duoduo-ai
          uri: lb://duoduo-ai
          predicates:
            - Path=/api/duoduo/**

duoduo:
  security:
    # 生产必须由配置中心 / 环境变量注入，禁止使用默认值
    jwt-secret: ${DUODUO_JWT_SECRET:duoduo-local-dev-secret-please-change-in-production-32b}
    access-token-ttl: 15m
    refresh-token-ttl: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.duoduo: INFO
    org.springframework.cloud.gateway: INFO
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"duoduo-gateway","requestId":"%X{requestId}","logger":"%c{1}","msg":"%replace(%m){''"'',''\\"''}","thread":"%t"}%n'
