server:
  # 注意：不要用 PRODUCT_PORT 这类通用名，宿主/CI 环境可能已占用该变量名而静默改写端口
  port: ${DUODUO_PRODUCT_PORT:8082}
  shutdown: graceful
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 1000
    max-connections: 10000

spring:
  application:
    name: duoduo-product
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/duoduo_product?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:duoduo}
    password: ${DB_PASSWORD:duoduo}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 20
      maximum-pool-size: 100
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: duoduo-product-pool
  sql:
    init:
      mode: never

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

  elasticsearch:
    # A10 · ES 检索（可选加速层）。uris 默认指向 compose 网络内的 duoduo-es；
    # 本地 IDE 运行改 DUODUO_ES_URL=http://127.0.0.1:9200。
    uris: ${DUODUO_ES_URL:http://127.0.0.1:9200}
    connection-timeout: 300ms   # ES 不在场时快速失败 → 立刻降级回 MySQL，搜索请求不等超时
    socket-timeout: 2s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input

duoduo:
  id:
    datacenter-id: ${ID_DATACENTER:1}
    worker-id: ${ID_WORKER:2}
  internal:
    # 服务间调用共享密钥，用于保护库存写接口（/api/products/skus/stock/**）。
    # 默认值只是为了让本地容器开箱可跑；**生产必须用环境变量 INTERNAL_TOKEN 覆盖**。
    # 校验默认开启（失败关闭），不做「没配就放行」。
    token: ${INTERNAL_TOKEN:duoduo-local-dev-internal-token}
    # 服务间调用凭据（第五十八轮 P0-3）：签名有效期（秒）与「每个调用方一把显式密钥」。
    # 两者都可不配：默认 300 秒，且密钥按调用方身份从根密钥派生（见 InternalCallAuth）。
    signature-skew-seconds: ${INTERNAL_SKEW_SECONDS:300}
    caller-secrets: ${INTERNAL_CALLER_SECRETS:}
  product:
    # 平台禁售/违规词表，搜索与商品标题双向拦截。
    # 生产形态下由配置中心下发，并叠加内容安全服务做语义识别。
    banned-words:
      - 保护动物
      - 象牙
      - 犀牛角
      - 虎骨
      - 人用处方药
      - 氰化物
      - 毒鼠强
  search:
    # A10 · ES 检索开关：false 时一律走 MySQL（本地 IDE / 单机零依赖模式的默认）。
    # true 时 keyword 检索 ES 优先，**任何 ES 异常都原地降级回 MySQL**（验收④），
    # 因此本开关开错方向也不会让搜索挂掉。
    enabled: ${DUODUO_SEARCH_ENABLED:false}
    # 对账扫描间隔（毫秒）：把 updated_at 变过的 SPU / 闲置与 SKU 库存变动重新入索引。
    # A-12：3 秒一轮 + ES 默认 1 秒刷新 ≈ 最迟 4 秒可搜（验收线 5 秒）。
    # 单条写失败会进重试队列，下一轮继续补；不会因为一次抖动永久漏掉。
    sweep-interval-ms: ${DUODUO_SEARCH_SWEEP_MS:3000}
    # 同义词（一条一组，';' 分隔；组内 ',' 分隔）。**由应用侧替换生效**：把查询串里出现的词
    # 换成同组其它词，作为额外的 or 召回分支（见 SearchSynonyms，内含「为什么不能交给 ES
    # synonym filter」的实测依据）。改配置即时生效，无需重建索引。
    # 组内各项建议<b>不共享单字</b>：逐字分词下共享单字的词本来就互相命中，写成同义词没有增量。
    synonyms: ${DUODUO_SEARCH_SYNONYMS:犬,狗;幼犬,小狗;猫咪,喵星人;仓鼠,金丝熊}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # ES 不在场时容器健康检查必须仍是 UP（搜索降级是设计内行为，不是故障）；
    # 否则 ES 一停，健康门就把 product 判死，降级链路反而被探针杀死。
    elasticsearch:
      enabled: false

logging:
  level:
    root: INFO
    com.duoduo: INFO
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"duoduo-product","requestId":"%X{requestId}","logger":"%c{1}","msg":"%replace(%m){''"'',''\\"''}","thread":"%t"}%n'

# ── OpenAPI 契约（A6）────────────────────────────────────────────
# 随 duoduo-common-web 的 knife4j starter 自动装配，导出 /v3/api-docs 供契约比对与前端联调。
# 安全边界：网关路由是显式前缀白名单，/v3/api-docs 与 /doc.html 不会被路由到公网入口；
# 服务直连端口（8081~8085）仅本机/内网可达。生产若要彻底关闭，把 enabled 置 false 即可。
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false
knife4j:
  enable: true
  setting:
    language: zh_cn
